 sans-serif" font-size="22" fill="#222831">Check sources;</text><text x="580.0" y="614.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">write proposal</text><rect x="80" y="550" width="280" height="90" rx="8" stroke="#a638bd" fill="#f7eafa" stroke-width="2"/><text x="220.0" y="586.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Other harness:</text><text x="220.0" y="614.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">one critique</text><rect x="80" y="770" width="280" height="90" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="220.0" y="806.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">One rebuttal:</text><text x="220.0" y="834.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">accept / reject / refer</text><rect x="440" y="770" width="280" height="90" rx="8" stroke="#d66a16" fill="#fff0df" stroke-width="2"/><text x="580.0" y="806.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Human resolves</text><text x="580.0" y="834.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">remaining disputes</text><rect x="800" y="770" width="280" height="90" rx="8" stroke="#138968" fill="#e5f6ef" stroke-width="2"/><text x="940.0" y="806.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Dart or wave</text><text x="940.0" y="834.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">for follow-up</text><text x="80" y="967.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">Verify each quoted passage against its source page.</text><text x="80" y="992.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">Second opinions are for important plans; disputes return to you.</text><rect x="2570" y="310" width="280" height="90" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="2710.0" y="346.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Reconcile GitHub</text><text x="2710.0" y="374.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">and worktrees</text><rect x="2930" y="310" width="280" height="90" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="3070.0" y="346.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Goal for each</text><text x="3070.0" y="374.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">ready PR row</text><rect x="3290" y="310" width="280" height="90" rx="8" stroke="#a638bd" fill="#f7eafa" stroke-width="2"/><text x="3430.0" y="346.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Worker: own</text><text x="3430.0" y="374.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">terminal + worktree</text><rect x="3290" y="520" width="280" height="90" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="3430.0" y="556.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Monitor for PR;</text><text x="3430.0" y="584.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">report stalls</text><rect x="2930" y="520" width="280" height="90" rx="8" stroke="#a638bd" fill="#f7eafa" stroke-width="2"/><text x="3070.0" y="556.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Gate reviewer +</text><text x="3070.0" y="584.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">blind lab reviews</text><rect x="2570" y="765" width="280" height="90" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="2710.0" y="801.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Conductor lands</text><text x="2710.0" y="829.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">authorized PR</text><rect x="3290" y="765" width="280" height="90" rx="8" stroke="#a638bd" fill="#f7eafa" stroke-width="2"/><text x="3430.0" y="801.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Fix verified blockers;</text><text x="3430.0" y="829.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">max. two rounds</text><rect x="2930" y="1025" width="280" height="90" rx="8" stroke="#138968" fill="#e5f6ef" stroke-width="2"/><text x="3070.0" y="1061.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Close: carry-over</text><text x="3070.0" y="1089.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">+ shared learnings</text><polygon points="3070.0,740 3210,810.0 3070.0,880 2930,810.0" stroke="#dc4149" fill="#ffeded" stroke-width="2"/><text x="3070.0" y="801.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Any</text><text x="3070.0" y="829.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">blockers?</text><polygon points="2710.0,1000 2850,1070.0 2710.0,1140 2570,1070.0" stroke="#dc4149" fill="#ffeded" stroke-width="2"/><text x="2710.0" y="1061.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Rows</text><text x="2710.0" y="1089.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">remain?</text><rect x="2855" y="772" width="55" height="29" rx="8" stroke="transparent" fill="#fafbfd" stroke-width="0"/><text x="2860" y="791.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#47515f">no</text><rect x="3220" y="772" width="65" height="29" rx="8" stroke="transparent" fill="#fafbf ext-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">per worker</text><rect x="80" y="2080" width="280" height="90" rx="8" stroke="#a638bd" fill="#f7eafa" stroke-width="2"/><text x="220.0" y="2116.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Implement without</text><text x="220.0" y="2144.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">committing</text><rect x="80" y="2290" width="280" height="90" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="220.0" y="2326.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Read diff; rerun</text><text x="220.0" y="2354.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">verify; patch</text><rect x="440" y="2290" width="280" height="90" rx="8" stroke="#138968" fill="#e5f6ef" stroke-width="2"/><text x="580.0" y="2326.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Commit → push</text><text x="580.0" y="2354.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">→ draft PR</text><polygon points="580.0,1830 720,1895.0 580.0,1960 440,1895.0" stroke="#dc4149" fill="#ffeded" stroke-width="2"/><text x="580.0" y="1886.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Bug lacks</text><text x="580.0" y="1914.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">a repro?</text><rect x="725" y="1858" width="65" height="29" rx="8" stroke="transparent" fill="#fafbfd" stroke-width="0"/><text x="730" y="1877.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#47515f">yes</text><rect x="665" y="1972" width="65" height="29" rx="8" stroke="transparent" fill="#fafbfd" stroke-width="0"/><text x="670" y="1991.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#47515f">no</text><text x="80" y="2517.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">Workers leave the diff uncommitted. The conductor verifies,</text><text x="80" y="2542.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">then commits, pushes and opens a draft PR.</text><text x="80" y="2617.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">A dart never merges. A design-sized question becomes a wave.</text><text x="80" y="2642.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">Use flash review [E] for a quick second look at the local diff.</text><rect x="2570" y="2110" width="280" height="90" rx="8" stroke="#d66a16" fill="#fff0df" stroke-width="2"/><text x="2710.0" y="2160.61" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Any local diff</text><rect x="2930" y="2110" width="280" height="90" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="3070.0" y="2146.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Full patch +</text><text x="3070.0" y="2174.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">base/head SHAs</text><rect x="3290" y="2110" width="280" height="90" rx="8" stroke="#a638bd" fill="#f7eafa" stroke-width="2"/><text x="3430.0" y="2146.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">One cheap model;</text><text x="3430.0" y="2174.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">read-only terminal</text><rect x="3290" y="2320" width="280" height="90" rx="8" stroke="#138968" fill="#e5f6ef" stroke-width="2"/><text x="3430.0" y="2356.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Approve / reject +</text><text x="3430.0" y="2384.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">file:line findings</text><rect x="2930" y="2320" width="280" height="90" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="3070.0" y="2356.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Open cited lines;</text><text x="3070.0" y="2384.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">verify findings</text><rect x="2570" y="2320" width="280" height="90" rx="8" stroke="#d66a16" fill="#fff0df" stroke-width="2"/><text x="2710.0" y="2356.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Verdict to you;</text><text x="2710.0" y="2384.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">no PR comment</text><text x="2570" y="2557.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">One blocker means reject; verify the cited locations yourself.</text><text x="2570" y="2582.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">Deeper review goes to the multi-lab review swarm.</text><rect x="1330" y="2250" width="300" height="90" rx="8" stroke="#d66a16" fill="#fff0df" stroke-width="2"/><text x="1480.0" y="2286.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">One question at a time;</text><text x="1480.0" y="2314.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">recommendation + cost</text><rect x="1690" y="2250" width="300" height="90" rx="8" stroke="#d66a16" fill="#fff0df" stroke-width="2"/><text x="1840.0" y="2286.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">PR rows: deliverable,</text><text x="1840.0" y="2314.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">dependency, executor</text><rect x="2050" y="2250" width="280" height="90" rx="8" stroke="#d66a16" fill="#fff0df" stroke-width="2"/><text x="2190.0" y="2286.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Human confirms</text><text x="2190.0" y="2314.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">wave shape</text><rect x="1330" y="2480" width="1000" height="190" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="1830.0" y="2539.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Goal contract: outcome, context, scope and constraints</text><text x="1830.0" y="2566.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">CI verify commands + evidence of the requested behavior</text><text x="1830.0" y="2594.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Iterate / done / blocked-stop rules; under 4,000 characters</text><text x="1830.0" y="2621.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Quote commit / PR authority; otherwise leave work uncommitted</text><text x="1330" y="2747.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">Look up facts; humans decide. Copy each decision into both</text><text x="1330" y="2772.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">the worker goal and review criteria.</text><text x="1330" y="2847.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">Dependencies determine parallel, chained or phased work.</text><text x="1330" y="2872.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#5d6673">Track goal / PR / worktree / review / merge independently.</text><rect x="1855" y="1200" width="210" height="29" rx="8" stroke="transparent" fill="#fafbfd" stroke-width="0"/><text x="1860" y="1219.6" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#a14d0a">A · route work</text><rect x="40" y="3020" width="330" height="52" rx="8" stroke="#d66a16" fill="#fff0df" stroke-width="2"/><text x="205.0" y="3051.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Human decision</text><rect x="400" y="3020" width="330" height="52" rx="8" stroke="#4263d8" fill="#edf0ff" stroke-width="2"/><text x="565.0" y="3051.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Conductor</text><rect x="760" y="3020" width="330" height="52" rx="8" stroke="#a638bd" fill="#f7eafa" stroke-width="2"/><text x="925.0" y="3051.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Agent</text><rect x="1120" y="3020" width="330" height="52" rx="8" stroke="#dc4149" fill="#ffeded" stroke-width="2"/><text x="1285.0" y="3051.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Decision gate</text><rect x="1480" y="3020" width="330" height="52" rx="8" stroke="#138968" fill="#e5f6ef" stroke-width="2"/><text x="1645.0" y="3051.36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222831">Deliverable</text><text x="1940" y="3048.36" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#5d6673">Source: Carlos Garavito • My daily agent workflow • 25 Sep 2026</text><text x="1940" y="3081.84" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#5d6673">https://cgaravito.dev/en/blog/my-daily-agent-workflow</text></svg></main><footer>Scroll to zoom · drag to pan · select a panel to read it. To edit, open the downloaded file in Excalidraw (menu → Open). <a href="https://cgaravito.dev/en/blog/my-daily-agent-workflow" target="_blank" rel="noreferrer">Source article</a></footer>
<script>
const svg=document.querySelector('svg'), views={"All": [0, 0, 3660, 3120], "B": [-5, 135, 1170, 1030], "A": [1245, 135, 1170, 1050], "D": [2485, 135, 1170, 1560], "Daily loop": [1245, 1245, 1170, 690], "C": [-5, 1675, 1170, 1200], "E": [2485, 1925, 1170, 910], "F": [1245, 2055, 1170, 940]};
function getView(){return svg.getAttribute('viewBox').split(' ').map(Number)}
function setView(v){svg.setAttribute('viewBox',v.join(' '))}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{setView(views[b.dataset.view]);document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
function world(event){return new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener('wheel',event=>{event.preventDefault();const [x,y,w,h]=getView(),pt=world(event),factor=Math.exp(Math.max(-.3,Math.min(.3,event.deltaY*.001)));if(w*factor<300||w*factor>18000)return;setView([pt.x-(pt.x-x)*factor,pt.y-(pt.y-y)*factor,w*factor,h*factor])},{passive:false});
let dragging;
svg.addEventListener('pointerdown',event=>{if(event.button!==0)return;dragging={pt:world(event),view:getView()};svg.setPointerCapture(event.pointerId)});
svg.addEventListener('pointermove',event=>{if(!dragging)return;const pt=world(event),v=getView();setView([v[0]+dragging.pt.x-pt.x,v[1]+dragging.pt.y-pt.y,v[2],v[3]])});
for(const name of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(name,()=>dragging=null);
</script></html>
