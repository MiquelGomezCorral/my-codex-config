<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="2020" viewBox="0 0 2700 2020">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#243247"/></marker></defs>
<rect width="2700" height="2020" fill="#ffffff"/><text x="65" y="62" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700"><tspan x="65" dy="0">Implemented agent workflow</tspan></text><text x="66" y="97" text-anchor="start" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400"><tspan x="66" dy="0">Operational path from explicit request to approved slice, bounded workers, evidence gates, and named shipping actions</tspan></text><rect x="55" y="125" width="2590" height="205" rx="12" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2"/><rect x="78" y="155" width="910" height="145" rx="12" fill="#fff0d4" stroke="#b77716" stroke-width="2"/><text x="98" y="193" text-anchor="start" fill="#b77716" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="98" dy="0">E1 · INVOCATION</tspan></text><text x="98" y="227" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="98" dy="0">WORKFLOW ENTRY</tspan></text><text x="98" y="259" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="98" dy="0">Explicit $workflow or /commands/workflow starts planning and delivery.</tspan><tspan x="98" dy="24.7">Human approval gates the complete wave before coding.</tspan></text><rect x="1018" y="155" width="1598" height="145" rx="12" fill="#dcecff" stroke="#3b70a8" stroke-width="2"/><text x="1038" y="193" text-anchor="start" fill="#3b70a8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="1038" dy="0">E2 · DISPATCH + INSTALL</tspan></text><text x="1038" y="227" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="1038" dy="0">CODEX COMMAND REGISTRATION</tspan></text><text x="1038" y="259" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="1038" dy="0">UserPromptSubmit → dispatcher reads /commands/&lt;name&gt;.md → injects its skill and arguments.</tspan><tspan x="1038" dy="24.7">Bootstrap links commands and skills, and installs the listed Codex role TOMLs.</tspan></text><path d="M 990 228 L 1010 228" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><rect x="55" y="365" width="2590" height="380" rx="12" fill="#f4f7fb" stroke="#cbd5e1" stroke-width="2"/><text x="78" y="402" text-anchor="start" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700"><tspan x="78" dy="0">A  ·  PLAN AND AUTHORIZE</tspan></text><text x="2600" y="399" text-anchor="end" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400"><tspan x="2600" dy="0">Human approvals gate scope, implementation, worktrees, and live actions</tspan></text><rect x="88" y="440" width="580" height="255" rx="12" fill="#dcecff" stroke="#3b70a8" stroke-width="2"/><text x="108" y="478" text-anchor="start" fill="#3b70a8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="108" dy="0">E3 · PLAN</tspan></text><text x="108" y="512" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="108" dy="0">1  Discover + propose</tspan></text><text x="108" y="545" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400"><tspan x="108" dy="0">Inspect current behavior and evidence.</tspan><tspan x="108" dy="26.0">Set goal, scope, exclusions, risks,</tspan><tspan x="108" dy="26.0">and a minimum validation route.</tspan><tspan x="108" dy="26.0">No implementation during planning.</tspan></text><rect x="718" y="440" width="580" height="255" rx="12" fill="#fff0d4" stroke="#b77716" stroke-width="2"/><text x="738" y="478" text-anchor="start" fill="#b77716" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="738" dy="0">E3 · HUMAN GATE</tspan></text><text x="738" y="512" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="738" dy="0">2  Improve + accept candidate</tspan></text><text x="738" y="545" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400"><tspan x="738" dy="0">Resolve material choices; keep scope</tspan><tspan x="738" dy="26.0">locked. Human accepts the candidate</tspan><tspan x="738" dy="26.0">plan before adversarial review.</tspan></text><rect x="1348" y="440" width="580" height="255" rx="12" fill="#eee7ff" stroke="#7856a8" stroke-width="2"/><text x="1368" y="478" text-anchor="start" fill="#7856a8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="1368" dy="0">E4 · REVIEW-PLAN</tspan></text><text x="1368" y="512" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="1368" dy="0">3  Critique + finalize</tspan></text><text x="1368" y="545" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400"><tspan x="1368" dy="0">One read-only high-tier critic challenges the plan</tspan><tspan x="1368" dy="26.0">from a different model family than the planner.</tspan><tspan x="1368" dy="26.0">Keep explicit routes; report unmet family conditions.</tspan></text><rect x="1978" y="440" width="580" height="255" rx="12" fill="#fff0d4" stroke="#b77716" stroke-width="2"/><text x="1998" y="478" text-anchor="start" fill="#b77716" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="1998" dy="0">E3 · WORKFLOW</tspan></text><text x="1998" y="512" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="1998" dy="0">4  Prepare slice + approve</tspan></text><text x="1998" y="544" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="1998" dy="0">Ground current slice, owner, size, checks,</tspan><tspan x="1998" dy="24.7">sample, and review preset. Human</tspan><tspan x="1998" dy="24.7">approves implementation and bounded</tspan><tspan x="1998" dy="24.7">worktree/live actions before dispatch.</tspan></text><path d="M 668 566 L 718 566" fill="none" stroke="#243247" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 1298 566 L 1348 566" fill="none" stroke="#243247" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 1928 566 L 1978 566" fill="none" stroke="#243247" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><rect x="55" y="790" width="2590" height="525" rx="12" fill="#f4f7fb" stroke="#cbd5e1" stroke-width="2"/><text x="78" y="827" text-anchor="start" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700"><tspan x="78" dy="0">B  ·  IMPLEMENT, CHECK, REVIEW</tspan></text><text x="2600" y="824" text-anchor="end" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400"><tspan x="2600" dy="0">One product-code writer per slice; unavailable evidence stays blocked / unverified</tspan></text><rect x="82" y="865" width="560" height="360" rx="12" fill="#e2f4eb" stroke="#3c8460" stroke-width="2"/><text x="102" y="903" text-anchor="start" fill="#3c8460" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="102" dy="0">E5 · SIZE BRANCH</tspan></text><text x="102" y="937" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="102" dy="0">5  Implement</tspan></text><text x="102" y="970" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400"><tspan x="102" dy="0">small → root routes one retained coder.</tspan><tspan x="102" dy="26.0">large → read-only coding-supervisor</tspan><tspan x="102" dy="26.0">coordinates exactly one retained coder.</tspan><tspan x="102" dy="26.0">Coder follows persisted approved plan;</tspan><tspan x="102" dy="26.0">no live validation without authorization.</tspan></text><rect x="692" y="865" width="410" height="360" rx="12" fill="#dff4f3" stroke="#26817d" stroke-width="2"/><text x="712" y="903" text-anchor="start" fill="#26817d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="712" dy="0">E5 · BOUNDED CHECKS</tspan></text><text x="712" y="937" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="712" dy="0">6  Readiness checks</tspan></text><text x="712" y="970" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400"><tspan x="712" dy="0">Run plan-selected checks.</tspan><tspan x="712" dy="26.0">Inspect a real application flow</tspan><tspan x="712" dy="26.0">only when the exact flow and</tspan><tspan x="712" dy="26.0">side effects are authorized.</tspan></text><rect x="1152" y="865" width="810" height="360" rx="12" fill="#eee7ff" stroke="#7856a8" stroke-width="2"/><text x="1172" y="903" text-anchor="start" fill="#7856a8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="1172" dy="0">E6 · PRESET BRANCH</tspan></text><text x="1172" y="937" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="1172" dy="0">7  Read-only review preset</tspan></text><text x="1172" y="969" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="1172" dy="0">flash → quick; direct → review-worker.</tspan><tspan x="1172" dy="24.7">swarm → coordinator + justified specialists.</tspan><tspan x="1172" dy="24.7">swarm-smart/full → separate verifier; full → live-validator with bounded approval.</tspan><tspan x="1172" dy="24.7">Workflow: full plan + base→head and task-owned staged, unstaged,</tspan><tspan x="1172" dy="24.7">untracked changes; report inspected revisions. No fixer.</tspan></text><rect x="2012" y="865" width="546" height="360" rx="12" fill="#fff0d4" stroke="#b77716" stroke-width="2"/><text x="2032" y="903" text-anchor="start" fill="#b77716" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="2032" dy="0">E5 · FEEDBACK GATE</tspan></text><text x="2032" y="937" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="2032" dy="0">8  Verify findings + gate</tspan></text><text x="2032" y="969" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="2032" dy="0">Verify every claim against source.</tspan><tspan x="2032" dy="24.7">In-scope P0–P3 → coder corrections;</tspan><tspan x="2032" dy="24.7">repeat affected checks and review.</tspan><tspan x="2032" dy="24.7">Out of scope → record only. Missing</tspan><tspan x="2032" dy="24.7">evidence → blocked / unverified.</tspan><tspan x="2032" dy="24.7">Escalate after 2 failed rounds.</tspan></text><path d="M 642 1045 L 692 1045" fill="none" stroke="#243247" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 1102 1045 L 1152 1045" fill="none" stroke="#243247" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 1962 1045 L 2012 1045" fill="none" stroke="#243247" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 2285 1225 L 2285 1283 L 360 1283 L 360 1228" fill="none" stroke="#b5524b" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><text x="1280.0" y="1263" text-anchor="middle" fill="#b5524b" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600"><tspan x="1280.0" dy="0">verified correction → coder</tspan></text><text x="2285.0" y="1249" text-anchor="middle" fill="#3c8460" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="2285.0" dy="0">Pass required behavior + evidence</tspan></text><rect x="55" y="1360" width="2590" height="390" rx="12" fill="#f4f7fb" stroke="#cbd5e1" stroke-width="2"/><text x="78" y="1397" text-anchor="start" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700"><tspan x="78" dy="0">C  ·  CLEANUP, PRESENT, SHIP</tspan></text><text x="2600" y="1394" text-anchor="end" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400"><tspan x="2600" dy="0">Cleanup is findings-only; shipping uses only Git actions named by the approved plan</tspan></text><rect x="83" y="1430" width="565" height="245" rx="12" fill="#dcecff" stroke="#3b70a8" stroke-width="2"/><text x="103" y="1468" text-anchor="start" fill="#3b70a8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="103" dy="0">E7 · CHECKPOINT + CLEANUP</tspan></text><text x="103" y="1502" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="103" dy="0">9  Checkpoint + cleanup</tspan></text><text x="103" y="1534" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="103" dy="0">Record slice base + checkpoint hash.</tspan><tspan x="103" dy="24.7">Compare committed base→head and later task-owned</tspan><tspan x="103" dy="24.7">staged, unstaged, and untracked changes.</tspan><tspan x="103" dy="24.7">Skip only when the complete comparison is empty.</tspan><tspan x="103" dy="24.7">Corrections return through coding; rerun checks + review.</tspan></text><rect x="698" y="1430" width="565" height="245" rx="12" fill="#fff0d4" stroke="#b77716" stroke-width="2"/><text x="718" y="1468" text-anchor="start" fill="#b77716" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="718" dy="0">E8 · HUMAN GATE</tspan></text><text x="718" y="1502" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="718" dy="0">10  Present observed result</tspan></text><text x="718" y="1534" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="718" dy="0">Show expected/observed flow, checks,</tspan><tspan x="718" dy="24.7">findings, artifacts, and evidence gaps.</tspan><tspan x="718" dy="24.7">Present after cleanup corrections pass affected</tspan><tspan x="718" dy="24.7">checks + review; wait for human acceptance.</tspan></text><rect x="1313" y="1430" width="565" height="245" rx="12" fill="#fff0d4" stroke="#b77716" stroke-width="2"/><text x="1333" y="1468" text-anchor="start" fill="#b77716" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="1333" dy="0">E8 · RESULT GATE</tspan></text><text x="1333" y="1502" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="1333" dy="0">11  Accept or return</tspan></text><text x="1333" y="1534" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="1333" dy="0">Human acceptance gates named Git</tspan><tspan x="1333" dy="24.7">actions. Corrections that change code</tspan><tspan x="1333" dy="24.7">return through coding + affected review.</tspan></text><rect x="1928" y="1430" width="630" height="245" rx="12" fill="#e2f4eb" stroke="#3c8460" stroke-width="2"/><text x="1948" y="1468" text-anchor="start" fill="#3c8460" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="1948" dy="0">E9 · GIT + NEXT SLICE</tspan></text><text x="1948" y="1502" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan x="1948" dy="0">12  Final Git handoff</tspan></text><text x="1948" y="1534" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="1948" dy="0">After acceptance, Git worker stages</tspan><tspan x="1948" dy="24.7">explicit accepted paths; commits only if needed.</tspan><tspan x="1948" dy="24.7">Exclude private memory, progress, temp, unrelated.</tspan><tspan x="1948" dy="24.7">Plan-scoped skills/config remain deliverables.</tspan><tspan x="1948" dy="24.7">Match accepted tree; record both hashes; plan push.</tspan></text><path d="M 648 1550 L 698 1550" fill="none" stroke="#243247" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 1263 1550 L 1313 1550" fill="none" stroke="#243247" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 1878 1550 L 1928 1550" fill="none" stroke="#243247" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 1595 1675 L 1595 1730 L 365 1730 L 365 1228" fill="none" stroke="#b77716" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><text x="1220.0" y="1713" text-anchor="middle" fill="#b77716" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600"><tspan x="1220.0" dy="0">human code corrections → step 5</tspan></text><path d="M 365 1430 L 365 1350 L 365 1228" fill="none" stroke="#3b70a8" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><text x="650.0" y="1342" text-anchor="middle" fill="#3b70a8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600"><tspan x="650.0" dy="0">verified cleanup → step 5</tspan></text><path d="M 2460 1430 L 2625 1430 L 2625 566 L 2558 566" fill="none" stroke="#3c8460" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/><rect x="55" y="1790" width="2590" height="175" rx="12" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="1831" text-anchor="start" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="82" dy="0">STANDALONE ROUTES + BOUNDARIES</tspan></text><text x="82" y="1864" text-anchor="start" fill="#243247" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="82" dy="0">/commands/workflow → complete flow · /commands/review-plan → critic/finalize · /commands/code → implementation · /commands/review → read-only review · /commands/cleanup → audit-only</tspan></text><text x="82" y="1912" text-anchor="start" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="82" dy="0">OCR and Slopo are explicit opt-ins. Slices stay sequential; progress does not create approval. Live disposable flow remains pending user approval. [E6–E9]</tspan></text><text x="82" y="1946" text-anchor="start" fill="#52647a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400"><tspan x="82" dy="0">All worker routing, model selection, lifecycle, and permission limits flow through super-agent plus the active environment wrapper. [E10]</tspan></text></svg>
