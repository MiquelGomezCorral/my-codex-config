<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; frame-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>Workflow progress</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.55 system-ui, sans-serif; background: #101113; color: #ececec; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0 56px; }
    .topbar { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow, .muted, time, .field-label { color: #a7a9ad; }
    .eyebrow { margin: 0 0 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: 25px; font-weight: 620; letter-spacing: -.025em; }
    h2 { margin-bottom: 8px; font-size: 18px; font-weight: 590; }
    h3 { margin-bottom: 12px; font-size: 15px; font-weight: 590; }
    p { margin-bottom: 8px; }
    .refresh-error { min-height: 22px; color: #f0a6a6; text-align: right; }
    .panel { border: 1px solid #303238; border-radius: 12px; background: #17181b; padding: 18px; }
    .attention, .slices, .activity { margin-bottom: 18px; }
    .attention { border-color: #6b5a33; background: #1c1a14; }
    .attention-list { margin: 0; padding: 0; list-style: none; }
    .attention-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 7px 0; border-top: 1px solid #2f2b22; }
    .attention-row .stage-chip { margin: 0; }
    .attention-text { flex: 1 1 16rem; min-width: 0; overflow-wrap: break-word; }
    .attention-row[data-kind="blocker"] .attention-text { color: #f0a6a6; }
    .attention-meta { font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    .slice-table { width: 100%; border-collapse: collapse; }
    .slice-table th, .slice-table td { padding: 8px 10px; border-top: 1px solid #282a2e; text-align: left; vertical-align: top; overflow-wrap: break-word; }
    /* Chips and step labels never break inside, and several chips in one cell stack one per line;
       long slice text gets a fixed share instead of squeezing them. */
    .slice-table thead th:first-child { width: 26%; }
    .slice-table td:nth-child(3) { white-space: nowrap; }
    .slice-table .stage-chip { display: flex; width: fit-content; white-space: nowrap; }
    .slice-table thead th { border-top: 0; color: #a7a9ad; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .slice-table tbody th { font-weight: 600; }
    .stage-chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; margin: 0 6px 4px 0; padding: 1px 8px; border: 1px solid var(--chip-color); border-radius: 10px; color: var(--chip-color); font-size: 12px; font-weight: 600; line-height: 1.4; }
    .stage-chip svg { display: block; flex: 0 0 auto; width: 14px; height: 14px; }
    .stage-title .stage-chip { margin: 0; }
    .chip-warning { color: #f0a6a6; }
    .tab-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tab-list button { min-height: 32px; border: 1px solid #444750; border-radius: 6px; padding: 0 12px; background: #17181b; color: inherit; cursor: pointer; font: inherit; }
    .tab-list button[aria-selected="true"] { border-color: #9ec5ff; background: #222a36; color: #fff; }
    .tab-list button:focus-visible { outline: 2px solid #9ec5ff; outline-offset: 2px; }
    .activity-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
    .field-label { margin-bottom: 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .field-value { margin-bottom: 0; overflow-wrap: break-word; }
    .last-update { margin-top: 16px; margin-bottom: 0; font-size: 12px; }
    .progress-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
    .stage-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stage { border: 1px solid #303238; border-radius: 10px; background: #17181b; padding: 14px; }
    .stage-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; }
    .status-symbol svg { display: block; width: 16px; height: 16px; }
    .step-list, .plain-list { margin: 0; padding: 0; list-style: none; }
    .step-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid #282a2e; }
    .step-name { min-width: 0; overflow-wrap: break-word; }
    .status { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; color: #c5c7ca; font-size: 12px; }
    .status-active { color: #9ec5ff; }
    .status-done { color: #9ed6ad; }
    .status-waiting { color: #e6c27b; }
    .status-blocked { color: #f0a6a6; }
    .status-skipped { color: #aaaeb5; }
    .status-upcoming { color: #c5c7ca; }
    .status-symbol { width: 16px; text-align: center; }
    .status-symbol svg { width: 14px; height: 14px; }
    .notes, .supporting, .diagram { margin-top: 18px; }
    .note-card { border-left: 2px solid #75869c; padding-left: 12px; white-space: pre-wrap; overflow-wrap: break-word; }
    .note-meta { margin: 0 0 5px; font-size: 12px; }
    details { border-top: 1px solid #303238; padding-top: 12px; }
    details + details { margin-top: 12px; }
    summary { width: fit-content; cursor: pointer; color: #e1e2e4; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 16px; }
    .plain-list li { padding: 5px 0; border-top: 1px solid #282a2e; overflow-wrap: break-word; }
    .slice-card { margin-top: 14px; padding: 12px; border: 1px solid #303238; border-radius: 8px; }
    .slice-card h4 { margin: 0 0 8px; font-size: 13px; }
    .slice-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
    .slice-meta p { margin: 0; overflow-wrap: break-word; }
    .diagram-image { display: block; width: 100%; height: auto; margin-top: 14px; border: 1px solid #303238; border-radius: 8px; background: #fff; }
    .diagram-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .diagram-heading p { margin: 0; font-size: 12px; }
    #workflow-map-return { min-height: 36px; border: 1px solid #444750; border-radius: 6px; padding: 0 12px; background: #222429; color: inherit; cursor: pointer; font: inherit; }
    #workflow-map-return:focus-visible { outline: 2px solid #9ec5ff; outline-offset: 2px; }
    .workflow-map-frame { display: block; width: 100%; height: min(76vh, 860px); min-height: 540px; margin-top: 14px; border: 1px solid #303238; border-radius: 8px; background: #101113; }
    .diagram-warning { margin: 12px 0; padding: 10px 12px; border: 1px solid #a34f4f; border-radius: 7px; color: #ffd0d0; }
    .empty { color: #999da4; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 24px, 1120px); padding-top: 20px; }
      .stage-grid, .activity-grid, .detail-grid, .slice-meta { grid-template-columns: minmax(0, 1fr); }
      .topbar { align-items: start; flex-direction: column; gap: 8px; }
      .diagram-heading { align-items: start; flex-direction: column; }
      .workflow-map-frame { height: 70vh; min-height: 460px; }
      .refresh-error { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div><p class="eyebrow">Local agentic workflow</p><h1>Progress</h1></div>
      <div id="refresh-error" class="refresh-error" role="status" aria-live="polite"></div>
    </header>
    {{CONTENT}}
    {{DIAGRAM}}
  </div>
  <script>
    (() => {
      const refreshError = document.querySelector("#refresh-error")
      const mapFrame = document.querySelector("#workflow-map-frame")
      const diagramWarning = document.querySelector("#diagram-warning")
      let frameLoaded = false
      let childReady = false
      // A clicked tab stays selected across refreshes; until then the page follows the server's
      // default, the most recently updated slice.
      let chosenTab = null

      const readMapState = () => {
        const state = document.querySelector("#workflow-map-state")
        return state ? JSON.parse(state.textContent) : null
      }
      const selectedTab = (state) => (chosenTab && Object.hasOwn(state.tabs, chosenTab) ? chosenTab : state.defaultTab)
      const showTab = (tab) => {
        for (const button of document.querySelectorAll("#progress-content [data-tab]")) {
          button.setAttribute("aria-selected", String(button.dataset.tab === tab))
        }
        for (const panel of document.querySelectorAll("#progress-content [data-tab-panel]")) {
          panel.hidden = panel.dataset.tabPanel !== tab
        }
      }
      const sendMapState = (refocus = false) => {
        const state = readMapState()
        if (!frameLoaded || !childReady || !state) return
        mapFrame.contentWindow.postMessage({ type: "workflow-progress", ...state.tabs[selectedTab(state)] }, "*")
        if (refocus) mapFrame.contentWindow.postMessage({ type: "workflow-return-current" }, "*")
      }

      document.addEventListener("click", (event) => {
        const button = event.target.closest("#progress-content [data-tab]")
        if (!button) return
        chosenTab = button.dataset.tab
        showTab(chosenTab)
        sendMapState(true)
      })

      mapFrame.addEventListener("load", () => {
        frameLoaded = true
        sendMapState()
      })
      document.querySelector("#workflow-map-return").addEventListener("click", () => {
        if (frameLoaded && childReady) mapFrame.contentWindow.postMessage({ type: "workflow-return-current" }, "*")
      })
      window.addEventListener("message", (event) => {
        if (event.source !== mapFrame.contentWindow || !event.data || typeof event.data !== "object") return
        if (Object.keys(event.data).length === 1 && event.data.type === "workflow-map-ready") {
          childReady = true
          sendMapState()
        } else if (event.data.type === "workflow-map-warning" && Object.keys(event.data).every((key) => ["type", "messages"].includes(key))
          && Array.isArray(event.data.messages) && event.data.messages.length <= 40
          && event.data.messages.every((message) => typeof message === "string" && message.length <= 500)) {
          diagramWarning.textContent = `Map warning: ${event.data.messages.join(" ")}`
          diagramWarning.hidden = false
        }
      })

      if (location.protocol !== "http:" && location.protocol !== "https:") return
      const refresh = async () => {
        try {
          const response = await fetch("/content", { cache: "no-store" })
          if (!response.ok) throw new Error(`server returned ${response.status}`)
          const html = await response.text()
          const parsed = new DOMParser().parseFromString(html, "text/html")
          const replacement = parsed.querySelector("#progress-content")
          const current = document.querySelector("#progress-content")
          if (!replacement || !current) throw new Error("progress content is missing")
          const openPanels = new Set([...current.querySelectorAll("details[open][data-panel]")].map((panel) => panel.dataset.panel))
          const focusedTab = current.contains(document.activeElement) ? document.activeElement.dataset.tab : undefined
          const x = window.scrollX
          const y = window.scrollY
          current.replaceWith(document.importNode(replacement, true))
          for (const panel of document.querySelectorAll("#progress-content details[data-panel]")) {
            if (openPanels.has(panel.dataset.panel)) panel.open = true
          }
          const state = readMapState()
          if (state) showTab(selectedTab(state))
          if (focusedTab !== undefined) {
            [...document.querySelectorAll("#progress-content [data-tab]")]
              .find((button) => button.dataset.tab === focusedTab)?.focus({ preventScroll: true })
          }
          window.scrollTo(x, y)
          sendMapState()
          refreshError.textContent = ""
        } catch (error) {
          refreshError.textContent = `Refresh failed: ${error.message}`
        }
      }
      window.setInterval(refresh, 2000)
    })()
  </script>
</body>
</html>
