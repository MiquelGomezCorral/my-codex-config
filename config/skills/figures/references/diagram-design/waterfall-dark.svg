<title id="waterfall-dark-title">Open bugs this sprint, 42 to 30</title>
<desc id="waterfall-dark-desc">Waterfall chart: 42 open bugs at the start, plus 18 reported, minus 27 fixed (the largest change), minus 6 closed as won't fix, plus 3 reopened, leaves 30 open. Illustrative numbers.</desc>
