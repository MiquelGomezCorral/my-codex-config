<rect x="168" y="104" width="32" height="12" rx="2" fill="none" stroke="#1d1d1f" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="184" y="113" fill="#1d1d1f" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">ASK</text>
<text x="216" y="136" fill="#1d1d1f" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Pick the tool</text>
<text x="216" y="152" fill="#5b5b66" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" >Pele first</text>
<rect x="312" y="96" width="112" height="64" rx="6" fill="#ffffff"/>
<rect x="312" y="96" width="112" height="64" rx="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
<rect x="320" y="104" width="32" height="12" rx="2" fill="none" stroke="#1d1d1f" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="336" y="113" fill="#1d1d1f" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
<text x="368" y="136" fill="#1d1d1f" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Write source</text>
<text x="368" y="152" fill="#5b5b66" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" >text, spec or data</text>
<rect x="464" y="200" width="112" height="64" rx="6" fill="#ffffff"/>
<rect x="464" y="200" width="112" height="64" rx="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
<rect x="472" y="208" width="32" height="12" rx="2" fill="none" stroke="#1d1d1f" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="488" y="217" fill="#1d1d1f" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
<text x="520" y="240" fill="#1d1d1f" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Render light</text>
<text x="520" y="256" fill="#5b5b66" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" >on #ffffff</text>
<rect x="616" y="200" width="112" height="64" rx="6" fill="#ffffff"/>
<rect x="616" y="200" width="112" height="64" rx="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
<rect x="624" y="208" width="32" height="12" rx="2" fill="none" stroke="#1d1d1f" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="640" y="217" fill="#1d1d1f" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
<text x="672" y="240" fill="#1d1d1f" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Render dark</text>
<text x="672" y="256" fill="#5b5b66" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" >on #1d1d21</text>
<rect x="768" y="96" width="112" height="64" rx="6" fill="#ffffff"/>
<rect x="768" y="96" width="112" height="64" rx="6" fill="#2f5bd3" fill-opacity="0.08" stroke="#2f5bd3" stroke-width="1"/>
<rect x="776" y="104" width="36" height="12" rx="2" fill="none" stroke="#2f5bd3" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="794" y="113" fill="#2f5bd3" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
<text x="824" y="136" fill="#1d1d1f" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Look at 4 views</text>
<text x="824" y="152" fill="#5b5b66" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" >2 themes · 2 widths</text>
<rect x="768" y="312" width="112" height="64" rx="6" fill="#ffffff"/>
<rect x="768" y="312" width="112" height="64" rx="6" fill="#1d1d1f" fill-opacity="0.05" stroke="#5b5b66" stroke-width="1"/>
<rect x="776" y="320" width="36" height="12" rx="2" fill="none" stroke="#5b5b66" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="794" y="329" fill="#5b5b66" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">PAGE</text>
<text x="824" y="352" fill="#1d1d1f" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Fill the page</text>
<text x="824" y="368" fill="#5b5b66" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" >figure + caption</text>
<line x1="40" y1="416" x2="880" y2="416" stroke="#1d1d1f" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="40" y="432" fill="#5b5b66" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="448" width="14" height="10" rx="2" fill="#2f5bd3" fill-opacity="0.08" stroke="#2f5bd3" stroke-width="1"/>
<text x="60" y="456" fill="#5b5b66" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Gate</text>
<rect x="120" y="448" width="14" height="10" rx="2" fill="#ffffff" stroke="#1d1d1f" stroke-width="1"/>
<text x="140" y="456" fill="#5b5b66" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Step</text>
<rect x="200" y="448" width="14" height="10" rx="2" fill="#1d1d1f" fill-opacity="0.05" stroke="#5b5b66" stroke-width="1"/>
<text x="220" y="456" fill="#5b5b66" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Result</text>
<line x1="288" y1="453" x2="316" y2="453" stroke="#2f5bd3" stroke-width="1.4" marker-end="url(#swimlane-flow-arrow-accent)"/>
<text x="324" y="456" fill="#5b5b66" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Handoff to the page</text>
<line x1="452" y1="453" x2="480" y2="453" stroke="#5b5b66" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#swimlane-flow-arrow)"/>
<text x="488" y="456" fill="#5b5b66" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Back to the source</text>
</svg>
