<title id="architecture-overview-dark-title">Where each figure tool lands on an artifact page</title>
<desc id="architecture-overview-dark-desc">Architecture diagram: Pele, diagram-design, Excalidraw and Plotly each produce a figure field, and the figure block shows on the artifact page in both themes.</desc>
