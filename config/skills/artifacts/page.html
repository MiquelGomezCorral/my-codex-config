<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact</title>
<!-- Page content lives only in this JSON block. Fill it with scripts/fill.py or edit it here. -->
<script type="application/json" id="data">
{
  "title": "Empty artifact",
  "subtitle": "Fill this page with scripts/fill.py and a template from templates/.",
  "sections": []
}
</script>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e3e0;--acc:#2f5bd3;
--ok:#1f7a4d;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbe9e7;--warn:#8a5a00;--warnbg:#fff4dc;
--info:#2f5bd3;--infobg:#e8eefc;--muted-tone:#5b5b66;--mutedbg:#ececf0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1d1d21;
--ink:#ececf0;--muted:#a0a0aa;--line:#2e2e34;--acc:#8fb0ff;--ok:#5fd394;--okbg:#16301f;
--bad:#ff8a80;--badbg:#3a1a18;--warn:#ffcc66;--warnbg:#3a2e12;--info:#8fb0ff;--infobg:#1c2640;
--muted-tone:#b9b9c4;--mutedbg:#2a2a30}}
:root[data-theme="dark"]{--bg:#141416;--card:#1d1d21;--ink:#ececf0;--muted:#a0a0aa;--line:#2e2e34;
--acc:#8fb0ff;--ok:#5fd394;--okbg:#16301f;--bad:#ff8a80;--badbg:#3a1a18;--warn:#ffcc66;
--warnbg:#3a2e12;--info:#8fb0ff;--infobg:#1c2640;--muted-tone:#b9b9c4;--mutedbg:#2a2a30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1060px;margin:0 auto;padding:24px 16px 80px}
a{color:var(--acc)}
.eyebrow{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
h1{font-size:26px;margin:2px 0 4px}
h2{font-size:19px;margin:36px 0 10px;padding-top:10px;border-top:1px solid var(--line)}
h3{font-size:16px;margin:20px 0 8px}
.sub,.intro{color:var(--muted);margin:0 0 14px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
nav a{text-decoration:none;font-size:14px;border:1px solid var(--line);padding:3px 10px;border-radius:999px;background:var(--card)}
p{margin:8px 0}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--mutedbg);padding:0 4px;border-radius:4px}
pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}
pre code{background:none;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:13px}
.card h3{font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.callout{border-left:4px solid var(--tone,var(--info));background:var(--tonebg,var(--infobg));border-radius:8px;padding:10px 14px;margin:10px 0}
.callout b{display:block}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;color:var(--tone);background:var(--tonebg)}
.ok{--tone:var(--ok);--tonebg:var(--okbg)}.bad{--tone:var(--bad);--tonebg:var(--badbg)}
.warn{--tone:var(--warn);--tonebg:var(--warnbg)}.info{--tone:var(--info);--tonebg:var(--infobg)}
.muted{--tone:var(--muted-tone);--tonebg:var(--mutedbg)}
.stat.ok b,.stat.bad b,.stat.warn b,.stat.info b{color:var(--tone)}
table{width:100%;border-collapse:collapse;font-size:14px}
.scroll{overflow-x:auto;margin:10px 0}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--muted)}details[open]>summary::before{content:"▾"}
summary .id{font-weight:700}summary .t{flex:1;min-width:180px}
.body{padding:0 14px 12px}
dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:4px 12px}
dt{color:var(--muted);font-size:13px}dd{margin:0}
@media (max-width:600px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--line);color:var(--muted);font-style:italic}
blockquote cite{display:block;font-size:12px;font-style:normal}
.steps{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:10px 0}
.step{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.step b{display:block}.step span{color:var(--muted);font-size:14px}
.arrow{align-self:center;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0}
.cmp .card.rec{border:2px solid var(--acc)}
.cmp ul{margin:4px 0;padding-left:18px}.cmp .pro::marker{content:"+ "}.cmp .con::marker{content:"− "}
.decision{padding:12px 0;border-bottom:1px solid var(--line)}.decision:last-of-type{border-bottom:0}
.decision .q{font-weight:600}.decision .ctx{color:var(--muted);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;font-size:14px}
.opts label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;background:var(--card)}
.rec-note{font-size:13px;color:var(--acc)}
textarea{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:6px 8px;font:inherit;font-size:14px}
button{font:inherit;font-size:14px;border:1px solid var(--acc);color:var(--acc);background:var(--card);border-radius:8px;padding:6px 14px;cursor:pointer}
figure{margin:10px 0}
figure img,figure iframe{display:block;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--card)}
figure iframe{width:100%}
figcaption{color:var(--muted);font-size:13px;margin-top:4px}
figcaption a{margin-left:8px;font-size:12px}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:20px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
body.slides main{max-width:none;padding:0}
body.slides .slide{display:none;min-height:100vh;padding:48px max(16px,8vw) 72px}
body.slides .slide.on{display:block}
body.slides .slide h2{font-size:30px;border:0;margin-top:0}
body.slides header.slide.on{display:flex;flex-direction:column;justify-content:center}
body.slides h1{font-size:44px}
.deck-bar{position:fixed;bottom:12px;right:16px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main id="root"></main>
<script>
"use strict";
const data = JSON.parse(document.getElementById("data").textContent);
const TONES = ["ok", "bad", "warn", "info", "muted"];
const DEFAULT_STATUSES = {
  ok: { label: "As expected", tone: "ok" },
  bad: { label: "Not as expected", tone: "bad" },
  decide: { label: "Needs decision", tone: "warn" },
  info: { label: "Info", tone: "info" },
};
const statuses = data.statuses || DEFAULT_STATUSES;
const storageKey = "artifact:" + location.pathname + ":" + (data.title || "");

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

// Inline Markdown subset: `code`, **bold**, *em*, [text](url), blank-line paragraphs.
function inline(text) {
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|[^):\s]+)\)/g, '<a href="$2">$1</a>');
}

function paragraphs(text) {
  return String(text ?? "").split(/\n\s*\n/).map((p) => `<p>${inline(p).replace(/\n/g, "<br>")}</p>`).join("");
}

function tone(name) {
  return TONES.includes(name) ? name : "muted";
}

function pill(statusKey) {
  const status = statuses[statusKey] || { label: statusKey, tone: "muted" };
  return `<span class="pill ${tone(status.tone)}">${escapeHtml(status.label)}</span>`;
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(storageKey)) || {}; } catch { return {}; }
}

function saveState(state) {
  try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch { /* storage blocked */ }
}

function allBlocks(type) {
  return (data.sections || []).flatMap((s) => s.blocks || []).filter((b) => b.type === type);
}

const renderers = {
  text: (b) => paragraphs(b.text),
  callout: (b) => `<div class="callout ${tone(b.tone || "info")}">${b.title ? `<b>${inline(b.title)}</b>` : ""}${paragraphs(b.text)}</div>`,
  list: (b) => {
    const tag = b.ordered ? "ol" : "ul";
    return `<${tag}>${(b.items || []).map((i) => `<li>${inline(i)}</li>`).join("")}</${tag}>`;
  },
  stats: (b) => {
    const items = [...(b.items || [])];
    if (b.auto) {
      const findings = allBlocks("findings").flatMap((f) => f.items || []);
      items.unshift({ value: findings.length, label: "Total" });
      for (const [key, status] of Object.entries(statuses)) {
        const count = findings.filter((f) => f.status === key).length;
        if (count) items.push({ value: count, label: status.label, tone: status.tone });
      }
    }
    return `<div class="grid stats">${items.map((i) => `<div class="card stat ${tone(i.tone)}"><b>${escapeHtml(i.value)}</b><span>${inline(i.label)}</span></div>`).join("")}</div>`;
  },
  cards: (b) => `<div class="grid">${(b.items || []).map((i) => `<div class="card"><h3>${inline(i.title)}${i.status ? pill(i.status) : ""}</h3>${paragraphs(i.text)}</div>`).join("")}</div>`,
  table: (b) => `<div class="scroll"><table><thead><tr>${(b.columns || []).map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${(b.rows || []).map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`,
  steps: (b) => `<div class="steps">${(b.items || []).map((i) => `<div class="step"><b>${inline(i.title)}</b><span>${inline(i.text)}</span></div>`).join('<span class="arrow">→</span>')}</div>`,
  details: (b) => (b.items || []).map((i) => `<details${i.open ? " open" : ""}><summary><span class="t">${inline(i.title)}</span></summary><div class="body">${paragraphs(i.text)}${(i.blocks || []).map(renderBlock).join("")}</div></details>`).join(""),
  findings: (b) => (b.items || []).map((i) => {
    const fields = (i.fields || []).map((f) => `<dt>${inline(f.label)}</dt><dd>${paragraphs(f.text)}</dd>`).join("");
    const quotes = (i.quotes || []).map((q) => `<blockquote>${inline(q.text)}${q.source ? `<cite>${inline(q.source)}</cite>` : ""}</blockquote>`).join("");
    return `<details${i.open ? " open" : ""}><summary>${i.id ? `<span class="id">${escapeHtml(i.id)}</span>` : ""}<span class="t">${inline(i.title)}</span>${pill(i.status)}</summary><div class="body"><dl>${fields}</dl>${quotes}</div></details>`;
  }).join(""),
  compare: (b) => {
    const cards = (b.options || []).map((o) => `<div class="card${o.name === b.recommended ? " rec" : ""}"><h3>${inline(o.name)}${o.name === b.recommended ? '<span class="pill info">Recommended</span>' : ""}</h3>${paragraphs(o.summary)}<ul>${(o.pros || []).map((p) => `<li class="pro">${inline(p)}</li>`).join("")}${(o.cons || []).map((c) => `<li class="con">${inline(c)}</li>`).join("")}</ul></div>`).join("");
    const criteria = b.criteria?.length ? renderers.table({ columns: ["", ...(b.options || []).map((o) => o.name)], rows: b.criteria.map((c) => [c.name, ...c.values]) }) : "";
    return `<div class="cmp">${cards}</div>${criteria}`;
  },
  decisions: (b) => {
    const state = loadState();
    return (b.items || []).map((d) => {
      const picked = state[d.id]?.choice ?? d.recommended;
      const options = (d.options || []).map((o) => `<label><input type="radio" name="dec-${escapeHtml(d.id)}" value="${escapeHtml(o)}"${o === picked ? " checked" : ""}>${inline(o)}</label>`).join("");
      return `<div class="decision" data-id="${escapeHtml(d.id)}"><div class="q">${escapeHtml(d.id)}. ${inline(d.question)}</div>${d.context ? `<div class="ctx">${inline(d.context)}</div>` : ""}<div class="opts">${options}</div>${d.recommended ? `<div class="rec-note">Recommended: ${inline(d.recommended)}</div>` : ""}<textarea placeholder="Note (optional)">${escapeHtml(state[d.id]?.note || "")}</textarea></div>`;
    }).join("") + '<p><button type="button" data-copy-decisions>Copy my decisions</button> <span class="copy-status sub"></span></p>';
  },
  code: (b) => `<pre><code>${escapeHtml(b.text)}</code></pre>`,
  figure: (b) => {
    const src = escapeHtml(b.src);
    // HTML diagrams and mockups run in a sandbox without access to this page or its storage.
    const media = /\.html?$/i.test(b.src || "")
      ? `<iframe src="${src}" title="${escapeHtml(b.alt || b.caption || "")}" style="height:${Number(b.height) || 420}px" loading="lazy" sandbox="allow-scripts"></iframe>`
      : `<img src="${src}" alt="${escapeHtml(b.alt || b.caption || "")}">`;
    const links = `<a href="${src}" target="_blank" rel="noopener">Open full size</a>${b.source ? `<a href="${escapeHtml(b.source)}" target="_blank" rel="noopener">Editable source</a>` : ""}`;
    return `<figure>${media}<figcaption>${inline(b.caption || "")}${links}</figcaption></figure>`;
  },
  // Escape hatch for hand-drawn SVG or markup no block covers; content is trusted agent output.
  html: (b) => b.html || "",
};

function renderBlock(block) {
  const render = renderers[block.type];
  const heading = block.heading ? `<h3>${inline(block.heading)}</h3>` : "";
  return heading + (render ? render(block) : `<div class="callout bad"><b>Unknown block type: ${escapeHtml(block.type)}</b></div>`);
}

function renderSection(section, index) {
  const id = section.id || "s" + (index + 1);
  const blocks = section.blocks || [];
  // "split" puts figures on the right and every other block on the left.
  const body = section.layout === "split"
    ? `<div class="split"><div>${blocks.filter((b) => b.type !== "figure").map(renderBlock).join("")}</div><div>${blocks.filter((b) => b.type === "figure").map(renderBlock).join("")}</div></div>`
    : blocks.map(renderBlock).join("");
  return `<section id="${escapeHtml(id)}" class="slide"><h2>${inline(section.title)}</h2>${section.intro ? `<p class="intro">${inline(section.intro)}</p>` : ""}${body}</section>`;
}

function renderHeader() {
  const eyebrow = data.eyebrow ? `<div class="eyebrow">${inline(data.eyebrow)}</div>` : "";
  const nav = data.layout === "slides" || (data.sections || []).length < 3 ? "" :
    `<nav>${data.sections.map((s, i) => `<a href="#${escapeHtml(s.id || "s" + (i + 1))}">${inline(s.title)}</a>`).join("")}</nav>`;
  return `<header class="slide">${eyebrow}<h1>${inline(data.title)}</h1>${data.subtitle ? `<p class="sub">${inline(data.subtitle)}</p>` : ""}${nav}</header>`;
}

function collectDecisions() {
  const state = {};
  const lines = [];
  for (const row of document.querySelectorAll(".decision")) {
    const choice = row.querySelector("input:checked")?.value || "";
    const note = row.querySelector("textarea").value.trim();
    state[row.dataset.id] = { choice, note };
    lines.push(`${row.dataset.id}: ${choice || "(no choice)"}${note ? ` - ${note}` : ""}`);
  }
  saveState(state);
  return lines.join("\n");
}

function wireDecisions() {
  document.addEventListener("change", (e) => { if (e.target.closest(".decision")) collectDecisions(); });
  document.addEventListener("input", (e) => { if (e.target.closest(".decision")) collectDecisions(); });
  document.addEventListener("click", async (e) => {
    if (!e.target.matches("[data-copy-decisions]")) return;
    const text = `Decisions for "${data.title}":\n` + collectDecisions();
    const status = e.target.parentElement.querySelector(".copy-status");
    try { await navigator.clipboard.writeText(text); status.textContent = "Copied."; }
    catch { status.textContent = "Copy blocked; select the text below."; e.target.parentElement.insertAdjacentHTML("beforeend", `<pre>${escapeHtml(text)}</pre>`); }
  });
}

function wireSlides() {
  document.body.classList.add("slides");
  const slides = [...document.querySelectorAll(".slide")];
  const bar = document.createElement("div");
  bar.className = "deck-bar";
  bar.innerHTML = '<button type="button" data-step="-1">‹</button><span></span><button type="button" data-step="1">›</button>';
  document.body.append(bar);
  let current = Math.min(Number(location.hash.slice(1)) || 0, slides.length - 1);
  const show = (index) => {
    current = Math.max(0, Math.min(index, slides.length - 1));
    slides.forEach((s, i) => s.classList.toggle("on", i === current));
    bar.querySelector("span").textContent = `${current + 1} / ${slides.length}`;
    history.replaceState(null, "", "#" + current);
  };
  bar.addEventListener("click", (e) => { if (e.target.dataset.step) show(current + Number(e.target.dataset.step)); });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("textarea, input")) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(current + 1); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(current - 1); }
  });
  show(current);
}

document.title = data.title || "Artifact";
document.getElementById("root").innerHTML = renderHeader() + (data.sections || []).map(renderSection).join("");
wireDecisions();
if (data.layout === "slides") wireSlides();
</script>
</body>
</html>
