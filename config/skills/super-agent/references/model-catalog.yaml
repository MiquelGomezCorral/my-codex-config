max_local_concurrency: 0 
local_models: not-available

# =======================================================================
#                               HARNESS
# =======================================================================
codex:
  low:
    model: gpt-6-luna
    thinking: medium
  medium:
    model: gpt-6-luna
    thinking: xhigh
  high:
    model: gpt-6.1-sol
    thinking: xhigh

claude:
  low:
    model: claude-haiku-5-5
    thinking: xhigh
  medium:
    model: claude-sonnet-5-5
    thinking: xhigh
  high:
    model: claude-opus-5-5
    thinking: xhigh

pi:
  available: not-available
  low:
    model: opencode-go/deepseek-v4.1-flash
    thinking: high
  medium:
    model:
      - opencode-go/glm-5.3-flash
      - opencode-go/deepseek-v4.1-flash
    thinking: high
  high:
    model:
      - opencode-go/glm-5.3-flash
      - opencode-go/deepseek-v4.1-flash
    thinking: max
  local:
    medium:
      model: local-llama/Qwen3.8-27B-GSQ-RCO-IQ2_S
      thinking: medium
    low:
      model:
        - bonsai-local/Ternary-Bonsai-2-27B-PQ2_0.gguf
        - local-llama/Qwen3.8-27B-GSQ-RCO-IQ2_XS
      thinking: medium

agy:
  low:
    model: gemini-3.8-flash-low
    thinking: low
  medium:
    model: gemini-3.8-flash-medium
    thinking: medium
  high:
    model: gemini-3.8-flash-high
    thinking: xhigh

# =======================================================================
#                               ROLES
# =======================================================================
super_agent:
  harness: claude
  model: claude-opus-5-5
  thinking: xhigh

sub_orchestrator:
  harness: claude
  model: claude-opus-5-5
  thinking: high

coder:
  harness: claude
  model: claude-sonnet-5-5
  thinking: high

adversarial:
  - harness: codex
    model: gpt-6.1-sol
    thinking: xhigh
  - harness: claude
    model: claude-fable-5-1
    thinking: high

reviewer-fast:
  harness: pi
  model:
    - opencode-go/deepseek-v4.1-flash
    - opencode-go/glm-5.3-flash
  thinking: max

reviewer-high:
  - harness: codex
    model: gpt-6.1-sol
    thinking: xhigh
  - harness: claude
    model:
      - claude-opus-5-5
      - claude-fable-5-1
    thinking: high

swarms:
  harness: pi
  model:
    - opencode-go/deepseek-v4.1-flash
    - opencode-go/glm-5.3-flash
  thinking: max
