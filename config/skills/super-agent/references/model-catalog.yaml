max_local_concurrency: 0
local_models: not-available

# =======================================================================
#                               HARNESS
# =======================================================================
codex:
  low:
    model: gpt-6-luna
    thinking: medium
  medium:
    model: gpt-6-luna
    thinking: xhigh
  high:
    model: gpt-6.1-sol
    thinking: xhigh

claude:
  low:
    model: claude-haiku-5-5
    thinking: xhigh
  medium:
    model: claude-sonnet-5-5
    thinking: xhigh
  high:
    model: claude-opus-5-5
    thinking: xhigh

pi:
  low:
    model: opencode-go/deepseek-v4.1-flash
    thinking: high
  medium:
    model:
      - opencode-go/glm-5.3-flash
      - opencode-go/deepseek-v4.1-flash
    thinking: high
  high:
    model:
      - opencode-go/glm-5.3-flash
      - opencode-go/deepseek-v4.1-flash
    thinking: max
  local:
    medium:
      model: local-llama/Qwen3.8-27B-GSQ-RCO-IQ2_S.gguf
      thinking: medium
    low:
      model:
        - bonsai-local/Ternary-Bonsai-2-27B-PQ2_0.gguf
        - local-llama/Qwen3.8-27B-GSQ-RCO-IQ2_XS.gguf
      thinking: medium

agy:
  low:
    model: gemini-3.8-flash-low
    thinking: low
  medium:
    model: gemini-3.8-flash-medium
    thinking: medium
  high:
    model: gemini-3.8-flash-high
    thinking: high

# =======================================================================
#                               ROLES
# =======================================================================
# A role written as a list is an ordered fallback: launch the first entry that can run
# and move to the next when it fails or is out of quota.
super_agent:
  harness: claude
  model: claude-opus-5-5
  thinking: xhigh

# sub_orchestrator, coder and git-worker take the entry for the task's Size (large, medium, small).
sub_orchestrator:
  large:
    harness: claude
    model: claude-opus-5-5
    thinking: high
  medium:
    harness: claude
    model: claude-sonnet-5-5
    thinking: high
  small: none

coder:
  large:
    harness: claude
    model: claude-sonnet-5-5
    thinking: xhigh
  medium:
    harness: claude
    model: claude-haiku-5-5
    thinking: max
  small:
    harness: pi
    model: opencode-go/deepseek-v4.1-flash
    thinking: max

explorer:
  - harness: pi
    model: opencode-go/deepseek-v4.1-flash
    thinking: max
  - harness: claude
    model: claude-haiku-5-5
    thinking: max

adversarial:
  - harness: codex
    model: gpt-6.1-sol
    thinking: xhigh
  - harness: agy
    model: gemini-3.8-flash-high
    thinking: high
  - harness: pi
    model:
      - opencode-go/deepseek-v4.1-flash
      - opencode-go/glm-5.3-flash
    thinking: max
#  - harness: claude
#    model: claude-fable-5-1
#    thinking: high

# Roles with `harness: current` below run on the harness of the agent doing the launch, using that
# harness's by_harness entry, or its `low` tier above when that model is unavailable.
reviewer-fast:
  harness: current
  by_harness:
    agy:
      model: gemini-3.8-flash-high
      thinking: high
    pi:
      model:
        - opencode-go/deepseek-v4.1-flash
        - opencode-go/glm-5.3-flash
      thinking: max
    codex:
      model: gpt-6-luna
      thinking: xhigh
    claude:
      model: claude-haiku-5-5
      thinking: xhigh

# Follows the launching harness, as reviewer-fast does.
computer-controller:
  harness: current
  by_harness:
    agy:
      model: gemini-3.8-flash-medium
      thinking: medium
    pi:
      model: opencode-go/deepseek-v4.1-flash
      thinking: medium
    codex:
      model: gpt-6-luna
      thinking: medium
    claude:
      model: claude-haiku-5-5
      thinking: medium

# Follows the launching harness, as computer-controller does.
ui-checker:
  harness: current
  by_harness:
    agy:
      model: gemini-3.8-flash-high
      thinking: high
    pi:
      model:
        - opencode-go/glm-5.3-flash
        - opencode-go/deepseek-v4.1-flash
      thinking: high
    codex:
      model: gpt-6-luna
      thinking: xhigh
    claude:
      model: claude-sonnet-5-5
      thinking: high

reviewer-high:
  - harness: codex
    model: gpt-6.1-sol
    thinking: xhigh
#  - harness: claude
#    model: claude-opus-5-5
#    thinking: high


swarms:
  harness: current
  by_harness:
    agy:
      model: gemini-3.8-flash-high
      thinking: high
    pi:
      model:
        - opencode-go/deepseek-v4.1-flash
        - opencode-go/glm-5.3-flash
      thinking: max
    claude:
      model: claude-haiku-5-5
      thinking: max
    codex:
      model: gpt-6-luna
      thinking: max


git-worker:
  large:
    harness: claude
    model: claude-sonnet-5-5
    thinking: xhigh
  medium:
    harness: claude
    model: claude-haiku-5-5
    thinking: max
  small:
    harness: pi
    model: opencode-go/deepseek-v4.1-flash
    thinking: max

# Claude helper launches only. Start Claude with AGENT_MODEL_GUARD=off to skip it for one session.
model_guard:
  claude-opus-5-5: [super_agent, sub_orchestrator, reviewer-high]
  claude-fable-5-1: [adversarial, reviewer-high]
