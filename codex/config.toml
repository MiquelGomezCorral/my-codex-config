model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
allow_login_shell = false
project_root_markers = [".git"]
web_search = "live"

[features]
hooks = true
multi_agent = true
plugins = true
memories = false

[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
interrupt_message = true

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.filters]
"AWS_*" = "exclude"
"AZURE_*" = "exclude"
"*_TOKEN" = "exclude"
"*_SECRET" = "exclude"
"*_KEY" = "exclude"

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
startup_timeout_sec = 120.0

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking@2026.7.4"]
startup_timeout_sec = 120.0

[mcp_servers.btca]
command = "btca"
args = ["mcp"]
startup_timeout_sec = 300.0

[mcp_servers.headroom]
command = "headroom"
args = ["mcp", "serve"]
startup_timeout_sec = 120.0

[mcp_servers.headroom.env]
HEADROOM_OUTPUT_SHAPER = "1"

[mcp_servers.vidext-operator-my-workspace]
url = "https://mcp-preview-feat-open-answer-on-quest.lab-063.workers.dev/api/mcp/operator"
